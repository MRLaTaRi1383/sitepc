<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل مدیریت | NoCenter</title>
    <link rel="stylesheet" href="https://cdn.font-store.ir/behdad.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark.css" />
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <div class="brand-mark"><i class="fas fa-cog"></i></div>
                <div><strong>پنل مدیریت</strong><small>NoCenter</small></div>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
                <a href="index.html" class="btn btn-secondary" style="padding:8px 16px;">
                    <i class="fas fa-arrow-right"></i> بازگشت
                </a>
                <button class="btn btn-danger" id="adminLogout" style="padding:8px 16px;">
                    <i class="fas fa-sign-out-alt"></i> خروج
                </button>
            </div>
        </div>
    </header>

    <!-- ===== LOGIN OVERLAY ===== -->
    <div class="admin-login-overlay" id="adminLoginOverlay">
        <div class="admin-login-box glass-strong">
            <div class="admin-login-icon"><i class="fas fa-shield-alt"></i></div>
            <h2>ورود به پنل مدیریت</h2>
            <p style="color:var(--muted); font-size:0.9rem;">لطفاً اطلاعات خود را وارد کنید</p>
            <form id="adminLoginForm">
                <input type="text" id="adminUsername" placeholder="نام کاربری" value="admin" />
                <input type="password" id="adminPassword" placeholder="رمز عبور" value="admin123" />
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
                    <i class="fas fa-sign-in-alt"></i> ورود
                </button>
                <p style="font-size:0.75rem; color:var(--muted); margin-top:8px;">پیش‌فرض: admin / admin123</p>
            </form>
        </div>
    </div>

    <!-- ===== ADMIN CONTENT ===== -->
    <main id="adminContent" style="display:none;">
        <div class="container">
            <div class="admin-panel glass-strong">
                <!-- Stats -->
                <div class="admin-stats">
                    <div class="stat-card glass">
                        <i class="fas fa-boxes"></i>
                        <div><span id="statProducts">0</span> کالا</div>
                    </div>
                    <div class="stat-card glass">
                        <i class="fas fa-tags"></i>
                        <div><span id="statCategories">0</span> دسته</div>
                    </div>
                    <div class="stat-card glass">
                        <i class="fas fa-hashtag"></i>
                        <div><span id="statTags">0</span> تگ</div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="products">📦 کالاها</button>
                    <button class="admin-tab" data-tab="categories">📂 دسته‌بندی</button>
                    <button class="admin-tab" data-tab="tags">🏷️ تگ‌ها</button>
                    <button class="admin-tab" data-tab="add">➕ افزودن کالا</button>
                </div>

                <!-- Tab: Products -->
                <div class="admin-tab-content active" id="tab-products">
                    <div class="admin-list" id="adminProductList"></div>
                </div>

                <!-- Tab: Categories -->
                <div class="admin-tab-content" id="tab-categories">
                    <div class="admin-form-row">
                        <input type="text" id="newCategory" placeholder="نام دسته‌بندی جدید" />
                        <button class="btn btn-primary" id="addCategoryBtn">افزودن</button>
                    </div>
                    <div class="admin-list" id="adminCategoryList"></div>
                </div>

                <!-- Tab: Tags -->
                <div class="admin-tab-content" id="tab-tags">
                    <div class="admin-form-row">
                        <input type="text" id="newTag" placeholder="نام تگ جدید" />
                        <button class="btn btn-primary" id="addTagBtn">افزودن</button>
                    </div>
                    <div class="admin-list" id="adminTagList"></div>
                </div>

                <!-- Tab: Add Product -->
                <div class="admin-tab-content" id="tab-add">
                    <form class="admin-form" id="adminForm">
                        <input type="hidden" id="editId" />
                        <input type="text" id="productTitle" placeholder="عنوان کالا *" required />
                        <select id="productCategory" required>
                            <option value="">دسته‌بندی *</option>
                        </select>
                        <input type="text" id="productTags" placeholder="تگ‌ها (با کاما جدا کنید)" />
                        <input type="number" id="productPrice" placeholder="قیمت (تومان) *" required />
                        <input type="text" id="productImage" placeholder="آدرس تصویر (URL)" />
                        
                        <select id="productStatus">
                            <option value="available">موجود</option>
                            <option value="sold">فروخته شده</option>
                            <option value="unavailable">ناموجود</option>
                        </select>
                        <input type="text" id="productColors" placeholder="رنگ‌ها (با کاما جدا کنید)" />
                        
                        <textarea id="productDesc" placeholder="توضیحات کالا" rows="3"></textarea>
                        
                        <div style="grid-column:1/-1; display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px;">
                            <select id="discountType">
                                <option value="">بدون تخفیف</option>
                                <option value="percent">درصدی</option>
                                <option value="fixed">مبلغ ثابت</option>
                            </select>
                            <input type="text" id="discountValue" placeholder="مقدار تخفیف" />
                            <input type="text" id="discountStart" placeholder="تاریخ شروع (1404/01/01)" />
                            <input type="text" id="discountEnd" placeholder="تاریخ پایان (1404/12/29)" />
                        </div>
                        <button type="submit" class="btn btn-primary" style="grid-column:1/-1; justify-content:center;">
                            <i class="fas fa-save"></i> ذخیره کالا
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer style="text-align:center; padding:30px 0; color:var(--muted);">
        <p>© ۱۴۰۵ NoCenter — پنل مدیریت</p>
    </footer>

    <script src="js/calendar.js"></script>
    <script src="js/database.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
