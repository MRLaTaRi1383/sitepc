<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>محصولات | NoCenter</title>
    <link rel="stylesheet" href="https://cdn.font-store.ir/behdad.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <a href="index.html" class="brand-link">
                    <div class="brand-mark"><i class="fas fa-cube"></i></div>
                    <div><strong>NoCenter</strong><small>فروشگاه دیجیتال</small></div>
                </a>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
                <a href="index.html" class="btn btn-secondary" style="padding:8px 16px;">
                    <i class="fas fa-arrow-right"></i> بازگشت
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="products-page">
                <div class="products-header">
                    <h1 id="pageTitle">همه محصولات</h1>
                    <div class="products-filters">
                        <select id="filterCategory">
                            <option value="all">همه دسته‌ها</option>
                            <option value="mobile">موبایل</option>
                            <option value="laptop">لپ‌تاپ</option>
                            <option value="computer">کامپیوتر</option>
                            <option value="accessory">لوازم جانبی</option>
                            <option value="sim">سیم‌کارت</option>
                        </select>
                        <select id="filterStatus">
                            <option value="all">همه وضعیت‌ها</option>
                            <option value="available">موجود</option>
                            <option value="sold">فروخته شده</option>
                            <option value="unavailable">ناموجود</option>
                        </select>
                        <select id="filterSort">
                            <option value="newest">جدیدترین</option>
                            <option value="price-asc">قیمت: کم به زیاد</option>
                            <option value="price-desc">قیمت: زیاد به کم</option>
                            <option value="popular">پربازدیدترین</option>
                            <option value="rating">بالاترین امتیاز</option>
                        </select>
                    </div>
                </div>
                <div class="product-grid" id="productGrid">
                    <!-- injected by JS -->
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© ۱۴۰۵ NoCenter</p>
                <p class="jalali-date" id="footerDate"></p>
            </div>
        </div>
    </footer>

    <!-- ===== MODALS ===== -->
    <!-- Product Detail Modal -->
    <div class="modal-overlay hidden" id="productModal">
        <div class="modal-box product-detail-modal">
            <div class="modal-header">
                <h3 id="productModalTitle">عنوان کالا</h3>
                <button class="modal-close" id="productModalClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="productModalBody">
                <!-- injected by JS -->
            </div>
        </div>
    </div>

    <!-- Buy Modal -->
    <div class="modal-overlay hidden" id="buyModal">
        <div class="modal-box buy-modal">
            <div class="modal-header">
                <h3>🛒 تکمیل خرید</h3>
                <button class="modal-close" id="buyModalClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="buyModalBody">
                <div class="buy-contact">
                    <h4>برای خرید و راهنمایی بیشتر با ما تماس بگیرید</h4>
                    <div class="contact-info">
                        <a href="tel:+989123456789"><i class="fas fa-phone"></i> ۰۹۱۲-۳۴۵-۶۷۸۹</a>
                        <p><i class="fas fa-map-marker-alt"></i> تهران، خیابان ولیعصر، پلاک ۱۲۳</p>
                    </div>
                    <div class="social-links">
                        <a href="#"><i class="fab fa-telegram"></i> تلگرام</a>
                        <a href="#"><i class="fab fa-instagram"></i> اینستاگرام</a>
                        <a href="#"><i class="fab fa-whatsapp"></i> واتساپ</a>
                        <a href="#"><i class="fab fa-youtube"></i> یوتیوب</a>
                    </div>
                    <p class="buy-note">جهت خرید حضوری به آدرس فوق مراجعه فرمایید</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/calendar.js"></script>
    <script src="js/database.js"></script>
    <script src="js/product.js"></script>
</body>
</html>
